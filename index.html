<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
    <div class="app-container">
        <h1 class="app-title">Weather</h1>

        <form id="weather-form" class="weather-form">
            <label for="city-input" class="field-label">City:</label>
            <div class="form-row">
            <input
              type="text"
              id="city-input"
              placeholder="Enter city name..."/>

              <button type="submit" id="get-weather-btn" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            

            <p id="error-message" class="error-message"></p>
        </form>
        <div id="weather-result" class="weather-result"></div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
